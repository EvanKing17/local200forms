<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms Admin</title>
<style>
  :root {
    --c-bg: #f6f7f9;
    --c-surface: #ffffff;
    --c-text: #111827;
    --c-text-muted: #555a66;
    --c-text-faint: #8a909c;
    --c-border: #e5e7eb;
    --c-border-strong: #d5d9e0;
    --c-accent: #2563eb;
    --c-accent-hover: #1d4ed8;
    --c-accent-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--c-bg);
    color: var(--c-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lede { color: var(--c-text-muted); margin: 0 0 28px; font-size: 13.5px; line-height: 1.5; }
  .lede strong { color: var(--c-text); }
  .card {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--c-text-faint);
    margin: 0 0 14px;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--c-text-muted);
    margin-bottom: 12px;
  }
  label:last-child { margin-bottom: 0; }
  input {
    font: inherit;
    font-size: 13.5px;
    color: var(--c-text);
    border: 1px solid var(--c-border-strong);
    border-radius: 8px;
    padding: 8px 10px;
  }
  input:focus { outline: 2px solid var(--c-accent); outline-offset: 1px; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 13.5px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary { background: var(--c-accent); color: var(--c-accent-text); }
  .btn-primary:hover { background: var(--c-accent-hover); }
  .status { font-size: 12.5px; color: var(--c-text-muted); }
  .status.error { color: #b91c1c; }
  .status.ok { color: #15803d; }
  code {
    background: var(--c-bg);
    border: 1px solid var(--c-border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Forms Admin</h1>
  <p class="lede">
    Local-only editor for <code>forms.config.json</code> — the titles and homepage labels shown
    in the app. Not linked from the app itself; open this file directly when you want to rename
    something. After saving, commit the updated <code>forms.config.json</code> to publish the
    change.
  </p>

  <div id="cards"></div>

  <div class="actions">
    <button type="button" class="btn-primary" id="saveBtn">Save forms.config.json</button>
    <span class="status" id="status"></span>
  </div>
</div>

<script>
const FIELDS = [
  { key: 'title', label: 'Title (sheet header / PDF heading)' },
  { key: 'homeLabel', label: 'Homepage card label' },
  { key: 'homeSub', label: 'Homepage card subtitle' },
];

const FORM_ORDER = ['ford', 'policy', 'unifor'];
const FORM_NAMES = { ford: 'Ford — Grievance Claim', policy: 'Ford — Policy Grievance', unifor: 'Unifor — Fact Sheet' };

let config = {};

async function load() {
  const res = await fetch('forms.config.json', { cache: 'no-store' });
  config = await res.json();
  render();
}

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  FORM_ORDER.forEach(type => {
    if (!config[type]) return;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>${FORM_NAMES[type] || type}</h2>`;
    FIELDS.forEach(f => {
      const label = document.createElement('label');
      label.textContent = f.label;
      const input = document.createElement('input');
      input.type = 'text';
      input.value = config[type][f.key] || '';
      input.dataset.type = type;
      input.dataset.key = f.key;
      label.appendChild(input);
      card.appendChild(label);
    });
    container.appendChild(card);
  });
}

function collect() {
  const next = {};
  document.querySelectorAll('#cards input').forEach(input => {
    const { type, key } = input.dataset;
    next[type] = next[type] || {};
    next[type][key] = input.value;
  });
  return next;
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

async function save() {
  const updated = { ...config, ...collect() };
  const json = JSON.stringify(updated, null, 2) + '\n';

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'forms.config.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      config = updated;
      setStatus('Saved. Commit forms.config.json to publish this change.', 'ok');
      return;
    } catch (err) {
      if (err.name === 'AbortError') { setStatus('Cancelled.'); return; }
      setStatus('Could not save directly (' + err.message + ') — downloading instead.', 'error');
    }
  }

  // Fallback for browsers without the File System Access API: trigger a normal download.
  // The anchor must be attached to the document, and the object URL must outlive the "Save As"
  // dialog if the browser is set to prompt for a location — revoking it immediately after click()
  // can race that dialog and produce a truncated (sometimes 0-byte) file.
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'forms.config.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  setStatus('Downloaded — replace forms.config.json in the project with this file, then commit.');
}

document.getElementById('saveBtn').addEventListener('click', save);
load();
</script>
</body>
</html>
